fullnameOverride: "manufacturing-execution-system-api"
 
replicaCount: 1
 
image:
  pullPolicy: Always

# App container port (must match PORT env var)
containerPort: 5000
 
# Plain environment variables (ConfigMap)
env:
  NODE_ENV: development
  LOG_LEVEL: debug
  PORT: "5000"
  SKIP_SYNC: "true"

  # Database (App-level config)
  DB_HOST: "localhost"
  DB_PORT: "5432"
  DB_NAME: "db_mfg_exec_system_d"
  DB_USER: "gitlab-ci-mfg-exec-system@codespire-infra-core-prod.iam"

  # Cloud SQL IAM (keep if used by infra)
  DATABASE_HOST: "localhost"
  DATABASE_PORT: "5432"
  DATABASE_NAME: "db_mfg_exec_system_d"
  DATABASE_USER: "gitlab-ci-mfg-exec-system@codespire-infra-core-prod.iam"
  DATABASE_SSL: "false"

  # JWT
  JWT_EXPIRES_IN: "8h"

  # Frontend
  FRONTEND_URL: "https://mes.dev.gcp.codespiresolutions.com"

  # AI Config
  AI_ENABLED: "true"
  AI_MODEL: "claude-haiku-4-5"
  AI_VISION_MODEL: "claude-sonnet-4-6"
  AI_MAX_TOKENS: "2048"
  AI_MONTHLY_BUDGET_CENTS: "5000"
  UPLOAD_DIR: "/app/uploads"
  UPLOAD_PATH: "/app/uploads"
  UPLOAD_PUBLIC_PATH: "/api/upload/image"
  UPLOAD_PUBLIC_URL: "https://mes.dev.gcp.codespiresolutions.com/api/upload/image"
  MAX_FILE_SIZE: "52428800"

# Sensitive variables injected from Kubernetes Secret (managed by DevOps)
envFrom:
  - type: secret
    name: manufacturing-execution-system-api-external-secret
    key: JWT_SECRET
    envName: JWT_SECRET
    optional: false
  - type: secret
    name: manufacturing-execution-system-api-external-secret
    key: ANTHROPIC_API_KEY
    envName: ANTHROPIC_API_KEY
    optional: false

# Probes
livenessProbe:
  enabled: true
  type: httpGet
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 30
  failureThreshold: 5
 
readinessProbe:
  enabled: true
  type: httpGet
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  failureThreshold: 5
  
# Persistence (PVC for file storage)
persistence:
  enabled: true
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 10Gi
  mountPath: /app/uploads
  subPath: ""
  existingClaim: ""
 
# Autoscaling
autoscaling:
  enabled: false

# Cloud SQL Auth Proxy
cloudSqlProxy:
  enabled: true
  instanceConnectionName: "codespire-infra-core-prod:us-central1:cs-sql-core-usc1-p-3a5b"
  port: 5432
  useIamAuth: true
  gcpServiceAccount: "gitlab-ci-mfg-exec-system@codespire-infra-core-prod.iam.gserviceaccount.com"
  privateIp: true
  image:
    repository: gcr.io/cloud-sql-connectors/cloud-sql-proxy
    tag: "2.20.0"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  healthCheck:
    enabled: true
    port: 9801
  structuredLogs: true
  debugLogs: false
  quitquitquit:
    enabled: true
    port: 9091
  maxSigtermDelay: "30s"
  exitZeroOnSigterm: true
  runConnectionTest: false
  extraArgs: []