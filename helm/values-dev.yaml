fullnameOverride: "manufacturing-execution-system-api"
 
replicaCount: 1
 
image:
  pullPolicy: Always
 
# Plain environment variables (ConfigMap)
env:
  NODE_ENV: development
  LOG_LEVEL: debug
  PORT: "5000"
  SKIP_SYNC: "true"

  # Database (App-level config)
  DB_HOST: "localhost"
  DB_PORT: "5432"
  DB_NAME: "db_mfg_exec_system_d"
  DB_USER: "gitlab-ci-mfg-exec-system@codespire-infra-core-prod.iam"

  # Cloud SQL IAM (keep if used by infra)
  DATABASE_HOST: "localhost"
  DATABASE_PORT: "5432"
  DATABASE_NAME: "db_mfg_exec_system_d"
  DATABASE_USER: "gitlab-ci-mfg-exec-system@codespire-infra-core-prod.iam"
  DATABASE_SSL: "false"

  # JWT
  JWT_EXPIRES_IN: "8h"

  # Frontend
  FRONTEND_URL: "https://mes.dev.gcp.codespiresolutions.com"

  # AI Config
  AI_ENABLED: "true"
  AI_MODEL: "claude-haiku-4-5"
  AI_VISION_MODEL: "claude-sonnet-4-6"
  AI_MAX_TOKENS: "2048"
  AI_MONTHLY_BUDGET_CENTS: "5000"
  UPLOAD_DIR: "/app/uploads"

# Sensitive variables (Kubernetes Secret)
envSecret:
  JWT_SECRET: "26832e922f8b16ce64653517e0b5ffc205bd4cbc8dfd13acb97d002a639c73f41bd51f48a4f6b09db3fc9cba28eb32d0084f7d58967b66ea7f7492b6fb8be08e"
 
# Resources
resources:
  limits:
    cpu: 250m
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 64Mi
 
# Probes
livenessProbe:
  enabled: true
  type: httpGet
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 30
  failureThreshold: 5
 
readinessProbe:
  enabled: true
  type: httpGet
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  failureThreshold: 5
 
# Routing
httpRoute:
  enabled: true
  parentRefs:
    - name: https-gateway
      namespace: gateway-system
      sectionName: https-dev
  hostnames:
    - mes.dev.gcp.codespiresolutions.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: manufacturing-execution-system-api
          port: 5000
 
# Persistence
persistence:
  enabled: true
  size: 1Gi
  mountPath: /app/uploads
 
# Autoscaling
autoscaling:
  enabled: false