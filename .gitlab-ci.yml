include:
  - project: 'codespire-core/ci-templates'
    file: 'complete/nodejs-api.yml'
# Optional: a small reusable debug snippet for deploy jobs (safe-ish)
.deploy_debug_on_fail: &deploy_debug_on_fail
  after_script:
    - |
      # Run debug only if job failed
      if [ "${CI_JOB_STATUS}" = "success" ]; then
        exit 0
      fi
 
      set +e
 
      # Same namespace logic as template
      if [ -n "${NAMESPACE_PREFIX:-}" ]; then
        FINAL_NAMESPACE="${NAMESPACE_PREFIX}-${NAMESPACE}"
      else
        FINAL_NAMESPACE="${NAMESPACE}"
      fi
 
      echo "❌ Deploy failed. Debug info (safe) for namespace: ${FINAL_NAMESPACE}"
 
      echo "== Pods =="
      kubectl -n "${FINAL_NAMESPACE}" get pods -o wide || true
 
      echo "== Events (last 80) =="
      kubectl -n "${FINAL_NAMESPACE}" get events --sort-by=.lastTimestamp | tail -n 80 || true
 
      echo "== Deployments / ReplicaSets / Services =="
      kubectl -n "${FINAL_NAMESPACE}" get deploy,rs,svc 2>/dev/null || true
 
      # Try to show logs from the newest 2 pods (ONLY app container if known; otherwise default container)
      echo "== Recent pod logs (tail 200) =="
      for p in $(kubectl -n "${FINAL_NAMESPACE}" get pods --sort-by=.metadata.creationTimestamp -o name | tail -n 2); do
        echo "---- init logs (create-upload-dirs): $p ----"
        kubectl -n "${FINAL_NAMESPACE}" logs "$p" -c create-upload-dirs --tail=200 || true
 
        echo "---- app logs (nodejs-prisma): $p ----"
        kubectl -n "${FINAL_NAMESPACE}" logs "$p" -c nodejs-prisma --tail=200 || true
      done
 
 
      echo "✅ Debug dump complete."
 
# Override only deploy:dev to add safe debug output on failure
# Keep the template's script intact (so chart clone + helm args remain correct)
deploy:dev:
  extends: .deploy:helm
  stage: deploy
  variables:
    NAMESPACE: dev
    VALUES_FILE: helm/values-dev.yaml
  environment:
    name: development
    url: https://${CI_PROJECT_NAME}.${DOMAIN_DEV}
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
  <<: *deploy_debug_on_fail
# (Optional) you can also add safe debug to prod deploy, but it's usually better NOT to.
# If you still want it, uncomment this block:
